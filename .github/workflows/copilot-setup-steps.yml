name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify skills CLI
        run: |
          # Verify skills CLI is available and working
          npx --yes skills --version
          echo "Skills CLI version verified"
        env:
          CI: true

      - name: Test skills list command
        run: |
          # Test that skills list command works (should return empty initially)
          npx skills list || echo "No skills installed yet (expected)"
          echo "Skills list command working"

      - name: List available skills
        run: |
          # List skills from vercel-labs/agent-skills repository
          npx skills add vercel-labs/agent-skills --list
          echo "Skills CLI installation test completed successfully"
