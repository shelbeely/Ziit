name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify skills CLI
        run: |
          # Verify skills CLI is available and working
          npx --yes skills --version
          echo "Skills CLI version verified"
        env:
          CI: true

      - name: Install find-skills skill
        run: |
          # Install the find-skills skill for agent skill discovery
          npx skills add vercel-labs/skills --skill find-skills -y
          echo "find-skills skill installed successfully"

      - name: Verify skills installation
        run: |
          # Verify the skill was installed
          npx skills list
          echo "Skills CLI installation test completed successfully"
